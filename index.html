<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Rishlene 💕</title>

  <!-- Cute Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ffd6ec, #ffeaf6, #e6d6ff);
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      width: 90%;
      max-width: 500px;
      padding: 30px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      animation: fadeIn 2s ease-in-out;
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      color: #ff4fa3;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1rem;
      color: #5a3e66;
      line-height: 1.6;
      margin: 15px 0;
    }

    .heart {
      font-size: 2rem;
      animation: float 3s infinite ease-in-out;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      background: #ff8fcf;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    button:hover {
      transform: scale(1.1);
      background: #ff6fb5;
    }

    .hidden-message {
      margin-top: 15px;
      display: none;
      font-weight: 400;
      color: #ff4fa3;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    /* Mobile adjustments */
    @media (max-width: 480px) {
      h1 { font-size: 2rem; }
      p { font-size: 1rem; }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="heart">💖</div>
    <h1>For My Dearest Rishlene</h1>
    <p>
      You are my sunshine, my peace, and my forever.
      Every day with you feels like a dream I never want to wake from.
    </p>

    <p>
      Loving you is the easiest and most beautiful thing I’ve ever done.
    </p>

    <button onclick="showMessage()">Click for a Surprise 💌</button>

    <p class="hidden-message" id="surprise">
      I will always choose you. In every lifetime. In every universe. 💕
    </p>
  </div>

  <script>
    function showMessage() {
      document.getElementById("surprise").style.display = "block";
    }
  </script>
</body>
</html>
